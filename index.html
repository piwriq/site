<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/v4-shims.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        neutral: '#6B7280',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <!-- 主题变量定义：浅色 / 暗色 / 护眼绿 -->
    <style>
        :root {
            --bg-from: #eff6ff;
            --bg-to: #eef2ff;
            --card-bg: #ffffff;
            --card-border: #f3f4f6;
            --card-hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --text-primary: #1f2937;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-faint: #9ca3af;
            --sidebar-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --input-text: #1f2937;
            --result-bg: #f9fafb;
            --result-hover: #f3f4f6;
            --icon-text: #2563eb;
            --icon-text-muted: #4b5563;
            --icon-bg-blue: #dbeafe;
            --icon-bg-pink: #fce7f3;
            --icon-bg-gray: #f3f4f6;
            --icon-bg-orange: #ffedd5;
            --icon-bg-red: #fee2e2;
            --brand: #4F46E5;
            --brand-glow: rgba(79, 70, 229, 0.3);
            --highlight: #4F46E5;
        }
        html[data-theme="dark"] {
            --bg-from: #0f172a;
            --bg-to: #1e1b4b;
            --card-bg: #1e293b;
            --card-border: #334155;
            --card-hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --sidebar-bg: #111827;
            --input-bg: #1f2937;
            --input-border: #374151;
            --input-text: #f3f4f6;
            --result-bg: #1f2937;
            --result-hover: #334155;
            --icon-text: #93c5fd;
            --icon-text-muted: #9ca3af;
            --icon-bg-blue: #1e3a5f;
            --icon-bg-pink: #4c1d2e;
            --icon-bg-gray: #374151;
            --icon-bg-orange: #5f3a1e;
            --icon-bg-red: #5f1e1e;
            --brand: #818cf8;
            --brand-glow: rgba(129, 140, 248, 0.3);
            --highlight: #818cf8;
        }
        html[data-theme="green"] {
            --bg-from: #d9f6d6;
            --bg-to: #c7e8c9;
            --card-bg: #f0f9ef;
            --card-border: #d8e3cb;
            --card-hover-shadow: 0 20px 25px -5px rgba(45, 85, 60, 0.15), 0 10px 10px -5px rgba(45, 85, 60, 0.08);
            --text-primary: #2c3e2f;
            --text-secondary: #3d4d41;
            --text-muted: #5d705f;
            --text-faint: #7d907f;
            --sidebar-bg: #eef9ed;
            --input-bg: #f6fbf5;
            --input-border: #c4ddc0;
            --input-text: #2c3e2f;
            --result-bg: #e6f2e3;
            --result-hover: #daebd6;
            --icon-text: #2e7d4f;
            --icon-text-muted: #55735c;
            --icon-bg-blue: #d7ecdc;
            --icon-bg-pink: #eedfe0;
            --icon-bg-gray: #e2eee3;
            --icon-bg-orange: #f2e6c8;
            --icon-bg-red: #f0dedb;
            --brand: #2e7d4f;
            --brand-glow: rgba(46, 125, 79, 0.3);
            --highlight: #2e7d4f;
        }
    </style>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-effect {
                backdrop-filter: blur(10px);
                background: rgba(255, 255, 255, 0.8);
            }
            .bg-theme {
                background-image: linear-gradient(135deg, var(--bg-from), var(--bg-to));
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: var(--card-hover-shadow);
            }
            .search-sidebar {
                position: fixed;
                top: 0;
                right: -350px;
                width: 350px;
                height: 100vh;
                background: var(--sidebar-bg);
                box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
                transition: right 0.3s ease;
                z-index: 1000;
            }
            .search-sidebar.open {
                right: 0;
            }
            .search-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
                z-index: 999;
            }
            .search-overlay.open {
                opacity: 1;
                visibility: visible;
            }
            .search-icon-btn {
                position: fixed;
                top: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                background: var(--brand);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 10px var(--brand-glow);
                cursor: pointer;
                transition: all 0.3s ease;
                z-index: 1001;
            }
            .search-icon-btn:hover {
                transform: scale(1.1);
                box-shadow: 0 6px 15px var(--brand-glow);
            }
            .function-card {
                transition: all 0.3s ease;
                opacity: 1;
                transform: translateY(0);
            }
            .function-card.hidden {
                opacity: 0;
                transform: translateY(10px);
                height: 0;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        }
    </style>
</head>
<body class="bg-theme min-h-screen font-inter">
    <!-- 主题切换按钮 -->
    <div id="themeToggle" class="fixed top-5 left-5 z-[1001] w-12 h-12 rounded-full flex items-center justify-center cursor-pointer shadow-lg transition-all duration-300 hover:scale-110" style="background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--card-border);" title="切换主题">
        <i id="themeIcon" class="fa fa-sun text-xl"></i>
    </div>

    <!-- 搜索侧边栏 -->
    <div class="search-sidebar" id="searchSidebar">
        <div class="p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-[var(--text-primary)]">功能搜索</h3>
                <button id="closeSearch" class="text-[var(--text-muted)] hover:text-[var(--text-secondary)]">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="relative mb-6">
                <input type="text" id="functionSearch" 
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors duration-300 bg-[var(--input-bg)] text-[var(--input-text)] border-[var(--input-border)]"
                       placeholder="输入功能关键词搜索...">
                <button type="button" id="clearSearchInput" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-faint)] hover:text-[var(--text-muted)] hidden">
                    <i class="fa fa-times-circle text-xl"></i>
                </button>
            </div>
            
            <div class="text-xs text-[var(--text-muted)] mb-6">
                <span class="text-primary font-medium">提示：</span> 输入功能关键词（如"通话"、"消消乐"、"查询"等）快速定位功能卡片
            </div>
            
            <div class="border-t pt-4" style="border-color: var(--card-border);">
                <h4 class="font-semibold text-[var(--text-secondary)] mb-3">搜索结果</h4>
                <div id="searchResults" class="space-y-3 max-h-[calc(100vh-250px)] overflow-y-auto">
                    <!-- 搜索结果将在这里动态显示 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索遮罩层 -->
    <div class="search-overlay" id="searchOverlay"></div>

    <!-- 侧边放大镜按钮 -->
    <div class="search-icon-btn" id="searchIconBtn">
        <i class="fa fa-search text-2xl"></i>
    </div>

    <!-- 主容器 -->

                <div class="bg-[var(--card-bg)] rounded-xl shadow-lg p-6 text-center border border-[var(--card-border)]">
                    <div class="w-16 h-16 bg-[var(--icon-bg-gray)] rounded-full flex items-center justify-center mx-auto mb-4">

                <div class="bg-[var(--card-bg)] rounded-xl shadow-lg p-6 text-center border border-[var(--card-border)]">

            <!-- 示例网站卡片 6 -->

                <div class="bg-[var(--card-bg)] rounded-xl shadow-lg p-6 text-center border border-[var(--card-border)]">
                    <div class="w-16 h-16 bg-[var(--icon-bg-blue)] rounded-full flex items-center justify-center mx-auto mb-4">

                    </div>
                    <h3 class="font-semibold text-[var(--text-primary)] mb-2">记事本API管理平台</h3>
                </div>

            <!-- 示例网站卡片 8 -->
            <a href="https://dcniaqwtmoca.aiforce.cloud/app/app_17dwnhp4qt7" target="_blank" class="card-hover function-card" data-title="飞书服务器面板" data-keywords="飞书,服务器,面板">

    <!-- 交互脚本 -->
    <script>
        // DOM元素
        const searchIconBtn = document.getElementById('searchIconBtn');
        const searchSidebar = document.getElementById('searchSidebar');
        const searchOverlay = document.getElementById('searchOverlay');
        const closeSearch = document.getElementById('closeSearch');
        const functionSearch = document.getElementById('functionSearch');
        const clearSearchInput = document.getElementById('clearSearchInput');
        const functionCards = document.querySelectorAll('.function-card');
        const searchResults = document.getElementById('searchResults');
        const functionCardsContainer = document.getElementById('functionCardsContainer');

        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themes = ['light', 'dark', 'green'];
        const themeIcons = { light: 'fa-sun', dark: 'fa-moon', green: 'fa-leaf' };

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('nav-theme', theme);
            themeIcon.className = 'fa ' + themeIcons[theme] + ' text-xl';
        }

        function themeVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#4F46E5';
        }

        themeToggle.addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = themes[(themes.indexOf(current) + 1) % themes.length];
            applyTheme(next);
        });

        // 初始化主题（本地持久化）
        applyTheme(localStorage.getItem('nav-theme') || 'light');

        // 初始化事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 搜索侧边栏相关事件
            searchIconBtn.addEventListener('click', toggleSearchSidebar);
            searchOverlay.addEventListener('click', toggleSearchSidebar);
            closeSearch.addEventListener('click', toggleSearchSidebar);
            
            // 搜索功能相关事件
            functionSearch.addEventListener('input', handleFunctionSearch);
            clearSearchInput.addEventListener('click', clearFunctionSearch);

            // 页面加载动画
            const cards = document.querySelectorAll('.card-hover');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'all 0.5s ease';
                    
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 50);
                }, index * 100);
            });
        });

        // 切换搜索侧边栏
        function toggleSearchSidebar() {
            searchSidebar.classList.toggle('open');
            searchOverlay.classList.toggle('open');
            
            // 如果打开搜索侧边栏，自动聚焦搜索框
            if (searchSidebar.classList.contains('open')) {
                setTimeout(() => {
                    functionSearch.focus();
                }, 300);
            }
        }

        // 功能卡片搜索处理
        function handleFunctionSearch() {
            const searchTerm = functionSearch.value.trim().toLowerCase();
            
            // 显示或隐藏清除按钮
            if (searchTerm) {
                clearSearchInput.classList.remove('hidden');
            } else {
                clearSearchInput.classList.add('hidden');
            }

            // 过滤匹配的卡片
            const matchedCards = Array.from(functionCards).filter(card => {
                const cardTitle = card.dataset.title.toLowerCase();
                const cardKeywords = card.dataset.keywords.toLowerCase();
                const cardContent = card.textContent.toLowerCase();
                
                return cardTitle.includes(searchTerm) || 
                       cardKeywords.includes(searchTerm) || 
                       cardContent.includes(searchTerm);
            });

            // 更新搜索结果显示
            updateSearchResults(matchedCards, searchTerm);

            // 在主页面中高亮显示匹配的卡片
            highlightMatchedCards(matchedCards);
        }

        // 更新搜索结果显示
        function updateSearchResults(matchedCards, searchTerm) {
            searchResults.innerHTML = '';
            
            if (searchTerm === '') {
                searchResults.innerHTML = '<p class="text-[var(--text-muted)] text-center">请输入关键词搜索功能</p>';
                return;
            }

            if (matchedCards.length === 0) {
                searchResults.innerHTML = '<p class="text-[var(--text-muted)] text-center">未找到匹配的功能</p>';
                return;
            }

            // 创建搜索结果列表
            matchedCards.forEach(card => {
                const resultItem = document.createElement('a');
                resultItem.href = card.href;
                resultItem.target = '_blank';
                resultItem.className = 'block p-3 bg-[var(--result-bg)] rounded-lg hover:bg-[var(--result-hover)] transition-colors duration-200';
                
                const cardTitle = card.dataset.title;
                const cardIcon = card.querySelector('i').cloneNode(true);
                
                resultItem.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
                            ${cardIcon.outerHTML}
                        </div>
                        <div>
                            <h4 class="font-medium text-[var(--text-primary)]">${cardTitle}</h4>
                        </div>
                    </div>
                `;
                
                searchResults.appendChild(resultItem);
            });
        }

        // 高亮显示匹配的卡片
        function highlightMatchedCards(matchedCards) {
            const highlightColor = themeVar('--highlight');
            const normalColor = themeVar('--card-border') || '#e5e7eb';
            functionCards.forEach(card => {
                if (matchedCards.includes(card)) {
                    card.classList.remove('hidden');
                    card.style.border = '2px solid ' + highlightColor;
                    card.style.transform = 'scale(1.02)';
                } else {
                    card.classList.add('hidden');
                    card.style.border = '1px solid ' + normalColor;
                    card.style.transform = 'scale(1)';
                }
            });
        }

        // 清除功能卡片搜索
        function clearFunctionSearch() {
            functionSearch.value = '';
            clearSearchInput.classList.add('hidden');
            
            // 显示所有功能卡片
            functionCards.forEach(card => {
                card.classList.remove('hidden');
                card.style.border = '1px solid ' + (themeVar('--card-border') || '#e5e7eb');
                card.style.transform = 'scale(1)';
            });
            
            // 清空搜索结果
            searchResults.innerHTML = '<p class="text-[var(--text-muted)] text-center">请输入关键词搜索功能</p>';
        }
    </script>
</body>
</html>
